{% extends "layout.html" %}

{% block title %}Home — My Blog{% endblock %}

{% block content %}
  <!-- Hero section with profile picture -->
  <section class="hero">
    <img src="{{ url_for('static', path='/profile_picture/default.png') }}"
         alt="Profile"
         class="avatar">
    <h1>Hi, I'm a Developer</h1>
    <p>I write about code, design, and everything in between.</p>
  </section>

  <!-- Post list rendered with a Jinja2 loop -->
  <section class="post-list">
    {% for post in posts %}
      <article class="card">
        <h2 class="card-title">{{ post.title }}</h2>
        <p class="card-content">{{ post.content }}</p>
        <a href="/posts/{{ post.id }}" class="card-link">Read more →</a>
      </article>
    {% endfor %}
  </section>
{% endblock %}
